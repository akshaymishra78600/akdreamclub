<title>Earn With Mani</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f4f4;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 20px;
  }

  .card {
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 32px 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }

  .avatar {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 4px solid #e6136b;
    object-fit: cover;
    margin-bottom: 16px;
  }

  .name {
    font-size: 22px;
    font-weight: 800;
    color: #1a1a1a;
    margin: 8px 0 20px;
    letter-spacing: 0.5px;
  }

  .join-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 20px;
    border: none;
    border-radius: 40px;
    background: linear-gradient(90deg, #e6136b 0%, #7b2ff7 50%, #1e3c8c 100%);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    position: relative;
  }

  .join-btn .icon {
    font-size: 18px;
  }

  .timer {
    margin-top: 22px;
    font-size: 26px;
    font-weight: 800;
    color: #e6136b;
    letter-spacing: 2px;
  }

  .labels {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    padding: 0 4px;
  }

  .labels span {
    font-size: 11px;
    font-weight: 700;
    color: #e6136b;
    letter-spacing: 0.5px;
    flex: 1;
  }

  .disclaimer {
    margin-top: 22px;
    font-size: 10px;
    color: #888;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="card">
    <img class="avatar" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhAf4FmYVaVFqcCwZi_jOykGqzZ5YosVpQlfOsOGAjqtAT6HbWBtvXehYRXf2G67jJ3MQXwTFwQN_AwnmVqmWGc0QvjWpeApgjgzUld4C55la0Nsom_9RFIMa42frGSfq-VGWxWUoOe_FG_Fcd2bAMKPImBEFjkhFrUBTJ-78A6_hwD_6XRQAzAK2AmFPLz/s1600/From_Klickpin_com_Bookmark_these_dreamy_ways_to_style_your_kids.jpg" alt="avatar">

    <div class="name">Earn With Mani</div>

    <a id="joinBtn" class="join-btn" href="https://t.me/+W6D4-sxN63ZhMDY1" rel="noopener">
      <span class="icon">&#9992;&#65039;</span> Join Free Telegram
    </a>

    <div class="timer" id="timer">00 : 00 : 00 : 55</div>
    <div class="labels">
      <span>DAYS</span>
      <span>HOURS</span>
      <span>MINUTES</span>
      <span>SECONDS</span>
    </div>

    <div class="disclaimer">
      Disclaimer: Join this channel at your own responsibility. The advertising agency holds no liability or responsibility for any content, services, or activities hosted within the Telegram channel.
    </div>
  </div>

  <script>
    let seconds = 55;
    let redirected = false;
    const timerEl = document.getElementById('timer');
    const btn = document.getElementById('joinBtn');

    btn.addEventListener('click', function () {
      redirected = true;
      clearInterval(interval);
    });

    function pad(n) {
      return n.toString().padStart(2, '0');
    }

    function updateTimer() {
      timerEl.textContent = `00 : 00 : 00 : ${pad(seconds)}`;
      if (seconds <= 0) {
        clearInterval(interval);
        if (!redirected) {
          redirected = true;
          window.location.href = btn.href;
        }
      }
      seconds--;
    }

    updateTimer();
    const interval = setInterval(updateTimer, 1000);
  </script>

</body>
